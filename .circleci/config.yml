version: 2.1

orbs:
  python: circleci/python@2.1.1

# Define a job to be invoked later in a workflow.
jobs:
  build-and-test:
    # Specify the execution environment. You can specify an image from Docker Hub or use one of our convenience images from CircleCI's Developer Hub.
    docker:
      # Specify the version you desire here
      - image: cimg/python:3.12

    # Set up a test db within the containers environment for tests
    environment:
      CI: true
      DATABASE_URL: sqlite:///test.db
      
    # Add steps to the job
    steps:
      # Checkout the code as the first step.
      # Allow docker commands within the container
      - checkout
      - setup_remote_docker

      - run:
          name: Build docker Image
          command: docker build -t regv1 -f api/Dockerfile .
      - run:
          name: Run tests in Docker
          command: |
            docker run -e DATABASE_URL="sqlite:///:memory:" \
                      -e JWT_SECRET_KEY="test-secret-key-for-ci" \
                      -e SECRET_KEY="test-secret-key-for-ci" \
                      -e SKIP_DB="true" \
                      -e CI="true" \
                      regv1 \
                      pytest api/tests -v

# Orchestrate jobs using workflows
workflows:
  creator:
    # Define the jobs you want to run.
    jobs:
      - build-and-test